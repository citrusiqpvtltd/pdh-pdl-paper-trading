name: Paper Trade

on:
  schedule:
    # Every 15 minutes, matching the strategy's own timeframe. GitHub's
    # scheduler is best-effort and can run a few minutes late - the script
    # processes every closed bar since its last run, not just the latest
    # one, so an occasional late/skipped tick causes no lost data.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python paper_trade.py

      - name: Commit results
        run: |
          git config user.name "pdh-pdl-paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ STATUS.md
          git diff --cached --quiet || git commit -m "Paper trade update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
