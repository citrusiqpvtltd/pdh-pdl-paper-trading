name: Backtest LLM engine (one-off, read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many most-recent days of history to replay through the real LLM"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          # `curl | sh` masks a curl failure (sh gets empty stdin, exits 0) -
          # confirmed on a real sharded run: a transient "Connection reset by
          # peer" left this step reporting "success" with nothing installed,
          # and the real failure only surfaced two steps later at `ollama
          # pull` ("command not found"). set -o pipefail + a retry + an
          # explicit post-check makes this fail fast and self-heal instead.
          set -o pipefail
          for i in 1 2 3; do
            curl -fsSL https://ollama.com/install.sh | sh && break
            echo "Install attempt $i failed, retrying..." >&2
            sleep 5
          done
          command -v ollama

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull qwen2.5:7b

      - name: Run backtest
        run: python backtest_llm.py --days "${{ github.event.inputs.days }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-llm-results
          path: |
            backtest_llm_trades.csv
            backtest_llm_decisions.csv
